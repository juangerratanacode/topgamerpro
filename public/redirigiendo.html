<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TopGamerPro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060f;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        padding: 24px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #1e2a44;
        border-top-color: #0ea5e9;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      p {
        margin: 0;
        color: #8ca3bf;
        font-size: 14px;
      }
      strong {
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <div>
      <strong>Confirmando tu pedido...</strong>
      <p>Te llevamos a WhatsApp en un momento.</p>
    </div>
  </body>
</html>
